<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Amazon Nova AI Chat</title>

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <!-- Sign In / Sign Up Screen -->
        <div class="auth-container" id="authScreen">

            <h2 id="authTitle">Sign In</h2>
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>
        
            <input type="text" id="name" class="auth-input" placeholder="Name" style="display: none;">
            <input type="email" id="email" class="auth-input" placeholder="Email Address">

            <!-- Password Field with Embedded Icon -->
            <div style="position: relative; width: 100%; margin-bottom: 12px;">
                <input type="password" id="password" class="auth-input" placeholder="Password" style="width: 100%; padding-right: 40px; margin-bottom: 0;">
    
                <!-- Clickable Icon Wrapper (Updated with user-select: none and preventDefault) -->
                <div onclick="togglePassword()" onmousedown="event.preventDefault()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #787878; display: flex; align-items: center; justify-content: center; transition: color 0.2s; user-select: none; -webkit-user-select: none;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#787878'">
        
                    <!-- Open Eye Icon -->
                    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>

                    <!-- Closed Eye Icon (Hidden by default) -->
                    <svg id="eyeClosed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
            </div>

            <button class="auth-btn" id="primaryAuthBtn" onclick="signIn()">Sign In</button>
            <button class="auth-btn secondary" id="secondaryAuthBtn" onclick="toggleMode()">Create an Account</button>

        </div>
    
        <!-- Chat Screen -->
        <div class="chat-container" id="chatScreen">
            <div class="chat-header">
                <span id="headerUserName" style="font-weight: bold;">Loading...</span>
                <div class="header-controls">
                    <button class="btn-small deleteAccount-btn" onclick="deleteAccount()">Delete Account</button>
                    <button class="btn-small signOut-btn" onclick="signOut()">Sign Out</button>
                    <button class="btn-small clearChat-btn" onclick="clearChat()">Clear Chat</button>
                </div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <p class="speech-status" id="speechStatus" role="status" aria-live="polite"></p>
            <div class="input-area">
                <input type="text" id="userInput" class="msg-input" placeholder="Ask anything..." autocomplete="new-password" onkeydown="if(event.key==='Enter') sendMessage()">
                <button type="button" class="speech-btn" id="speechBtn" onclick="toggleSpeechRecognition()" aria-label="Start voice input" aria-pressed="false" title="Start voice input">
                    <svg class="speech-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                        <path d="M5 10a7 7 0 0 0 14 0"></path>
                        <path d="M12 17v4"></path>
                        <path d="M8 21h8"></path>
                    </svg>
                </button>
                <button type="button" class="send-btn" onclick="sendMessage()" aria-label="Send message" title="Send message">
                    <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3.4 2.9a1 1 0 0 0-1.29 1.28l2.25 6.47a1 1 0 0 0 .81.66L12.6 12l-7.44.69a1 1 0 0 0-.81.66L2.1 19.82a1 1 0 0 0 1.29 1.28l17.94-8.18a1 1 0 0 0 0-1.82L3.4 2.9Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    
        <script src="script.js"></script>

        <!-- Secure Delete Account Model -->
        <div id="deleteModel" class="modal-overlay" style="display: none;" onclick="closeModalOnBackdrop(event)">
            <div class="delete-modal">
                <h3>Delete Account</h3>
                <p><br>Enter your password to permanently delete your account and chat history.<strong><br><br>This action cannot be undone!</strong></p>
                <p id="deletePasswordError" class="delete-password-error" role="alert" aria-live="polite"></p>
                <input type="password" id="deletePassword" class="auth-input delete-modal-input" placeholder="Password" oninput="clearDeletePasswordError()">
                <div class="delete-modal-actions">
                    <button class="btn-small modal-cancel-btn" onclick="closeDeleteModel()">Cancel</button>
                    <button class="btn-small deleteAccount-btn" onclick="confirmDeleteAccount()">Delete</button>
                </div>
            </div>
        </div>

        <!-- Clear Chat Confirmation Modal -->
        <div id="clearChatModal" class="modal-overlay" style="display: none;" onclick="closeModalOnBackdrop(event)">
            <div class="clear-chat-modal">
                <h3>Clear Chat</h3>
                <p>Are you sure you want to clear your entire chat history?</p>
                <div class="clear-chat-modal-actions">
                    <button class="btn-small modal-cancel-btn" onclick="closeClearChatModal()">Cancel</button>
                    <button class="btn-small clear-chat-confirm-btn" onclick="confirmClearChat()">Clear Chat</button>
                </div>
            </div>
        </div>

        <!-- Sign Out Confirmation Modal -->
        <div id="signOutModal" class="modal-overlay" style="display: none;" onclick="closeModalOnBackdrop(event)">
            <div class="sign-out-modal">
                <h3>Sign Out</h3>
                <p>Are you sure you want to sign out?</p>
                <div class="sign-out-modal-actions">
                    <button class="btn-small modal-cancel-btn" onclick="closeSignOutModal()">Cancel</button>
                    <button class="btn-small sign-out-confirm-btn" onclick="confirmSignOut()">Sign Out</button>
                </div>
            </div>
        </div>

    </body>

</html>
