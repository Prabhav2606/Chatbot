<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Amazon Nova AI Chat</title>

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <!-- Login / Signup Screen -->
        <div class="auth-container" id="authScreen">

            <h2 id="authTitle">Sign In</h2>
            <div class="auth-error" id="authError"></div>
            <div class="auth-success" id="authSuccess"></div>
        
            <input type="email" id="email" class="auth-input" placeholder="Email Address">

            <!-- Password Field with Embedded Icon -->
            <div style="position: relative; width: 100%; margin-bottom: 12px;">
                <input type="password" id="password" class="auth-input" placeholder="Password" style="width: 100%; padding-right: 40px; margin-bottom: 0;">
    
                <!-- Clickable Icon Wrapper (Updated with user-select: none and preventDefault) -->
                <div onclick="togglePassword()" onmousedown="event.preventDefault()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; display: flex; align-items: center; justify-content: center; transition: color 0.2s; user-select: none; -webkit-user-select: none;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#aaa'">
        
                    <!-- Open Eye Icon -->
                    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>

                    <!-- Closed Eye Icon (Hidden by default) -->
                    <svg id="eyeClosed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
            </div>

            <button class="auth-btn" id="primaryAuthBtn" onclick="signIn()">Sign In</button>
            <button class="auth-btn secondary" id="secondaryAuthBtn" onclick="toggleMode()">Create an Account</button>

        </div>
    
        <!-- Chat Screen -->
        <div class="chat-container" id="chatScreen">
            <div class="chat-header">
                <span id="chatHeaderTitle" style="font-size: 14px;">Amazon Nova</span>
                <div class="header-controls">
                    <button class="btn-small logout-btn" onclick="logOut()">Logout</button>
                    <button class="btn-small clear-btn" onclick="clearChat()">Clear Chat</button>
                </div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div class="input-area">
                <input type="text" id="userInput" class="msg-input" placeholder="Type a message..." autocomplete="new-password" onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    
        <script src="script.js"></script>

    </body>

</html>
